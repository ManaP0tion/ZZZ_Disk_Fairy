name: Deploy to Chrome Web Store

on:
  push:
    branches:
      - main
    paths:
      - extension/manifest.json # 버전을 올릴 때만 배포
  workflow_dispatch:

permissions:
  contents: write # 릴리스 생성

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        run: node test/run.js

      - name: Zip extension
        run: cd extension && zip -r ../extension.zip . -x "*.DS_Store"

      # 이미 같은 버전의 릴리스가 있으면(수동 재실행 등) 건너뛴다
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(jq -r .version extension/manifest.json)
          gh release view "$VER" >/dev/null 2>&1 || \
            gh release create "$VER" extension.zip --title "v$VER" --generate-notes --target "$GITHUB_SHA"

      - name: Upload to Chrome Web Store
        id: upload_chrome
        continue-on-error: true
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      - name: Warn when upload is blocked by store review
        if: steps.upload_chrome.outcome == 'failure'
        run: |
          echo "::warning::Chrome Web Store upload failed. This can happen when the extension is already in review."
